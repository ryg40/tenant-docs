# The static site. TLS ends at the reverse proxy of the host.
# This server speaks HTTP on the proxy network only.

# Astro puts a content hash into each file name under /_astro/, so a browser can keep such a file.
# Each other file can change in a deploy, so a browser asks again before it uses its copy.
map $uri $cache_control {
    default     "no-cache";
    ~^/_astro/  "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    # A recording of the asciinema player is JSON text.
    include /etc/nginx/mime.types;
    types {
        application/x-asciicast cast;
    }

    # The requests come through the reverse proxy, so `gzip_proxied` is necessary.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/x-asciicast
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Warning: an `add_header` line inside a `location` block removes each header of this list for that block.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    # The site loads each resource from its own origin. Starlight has inline scripts and inline styles.
    # The search (Pagefind) and the recording player run WebAssembly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The health check of the container. It writes no log line.
    location = /healthz {
        access_log off;
        return 204;
    }
}
